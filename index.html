<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Koi Luxury</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(
            circle at 65% 40%,
            #b50000 0%,
            #730000 45%,
            #260000 100%
        );
}

.hero {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* Soft cinematic glow */

.glow {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 65% 35%,
            rgba(255, 120, 120, 0.20),
            transparent 55%
        );

    animation: glowPulse 7s ease-in-out infinite;
}

/* Koi */

.koi {
    position: absolute;

    width: min(72vw, 850px);

    left: 63%;
    top: 48%;

    transform: translate(-50%, -50%);

    filter:
        drop-shadow(
            0 35px 35px rgba(0, 0, 0, 0.45)
        )
        drop-shadow(
            0 0 25px rgba(255, 80, 40, 0.18)
        );

    animation: koiFloat 8s ease-in-out infinite;

    user-select: none;
    pointer-events: none;
}

/* Content */

.content {
    position: absolute;

    left: 7%;
    bottom: 11%;

    z-index: 5;

    color: white;
}

.content h1 {
    font-family: Georgia, "Times New Roman", serif;

    font-size: clamp(3.5rem, 8vw, 7rem);

    line-height: 0.88;

    letter-spacing: -3px;

    font-weight: 700;
}

.content p {
    margin-top: 24px;

    width: min(420px, 80vw);

    font-size: 1.05rem;

    line-height: 1.7;

    color: rgba(255, 235, 235, 0.9);
}

.shop-button {
    display: inline-block;

    margin-top: 30px;

    padding: 16px 32px;

    border-radius: 40px;

    background: white;

    color: #800000;

    text-decoration: none;

    font-weight: 700;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.shop-button:hover {
    transform: translateY(-4px);

    box-shadow:
        0 15px 30px rgba(0, 0, 0, 0.25);
}

/* Animations */

@keyframes koiFloat {

    0% {
        transform:
            translate(-50%, -50%)
            rotate(-18deg)
            translate3d(0, 0, 0);
    }

    25% {
        transform:
            translate(-50%, -50%)
            rotate(-16deg)
            translate3d(12px, -14px, 0);
    }

    50% {
        transform:
            translate(-50%, -50%)
            rotate(-18deg)
            translate3d(0, 8px, 0);
    }

    75% {
        transform:
            translate(-50%, -50%)
            rotate(-20deg)
            translate3d(-14px, -8px, 0);
    }

    100% {
        transform:
            translate(-50%, -50%)
            rotate(-18deg)
            translate3d(0, 0, 0);
    }
}

@keyframes glowPulse {

    0%,
    100% {
        opacity: 0.55;
    }

    50% {
        opacity: 1;
    }
}

/* Mobile */

@media (max-width: 700px) {

    .koi {
        width: 105vw;
        left: 65%;
        top: 38%;
    }

    .content {
        left: 7%;
        bottom: 7%;
    }

    .content h1 {
        font-size: 3.5rem;
    }
}
</style>
</head>

<body>

<section class="hero">

    <div class="glow"></div>

    <img
        src="assets/koi.jpg"
        class="koi"
        alt="Koi Fish"
    >

    <div class="content">

        <h1>
            CREATE<br>
            EVERY DAY
        </h1>

        <p>
            Luxury products inspired by timeless Japanese craftsmanship.
        </p>

        <a href="#" class="shop-button">
            Shop Now
        </a>

    </div>

</section>

</body>
</html>
