<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Koi Luxury</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background:
        radial-gradient(
            circle at center,
            #b30000 0%,
            #700000 60%,
            #2a0000 100%
        );
}

.hero {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.glow {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(255, 130, 130, 0.18),
            transparent 55%
        );

    animation: pulse 6s ease-in-out infinite;
}

/* FISH */

.fish {
    position: absolute;

    left: 58%;
    top: 44%;

    width: min(80vw, 850px);
    aspect-ratio: 4 / 5;

    transform: translate(-50%, -50%);

    filter:
        drop-shadow(0 45px 45px rgba(0, 0, 0, 0.45));
}

.head,
.body,
.tail,
.fin {
    position: absolute;
    inset: 0;

    background-image: url("assets/koi.jpg");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}

.head {
    clip-path: polygon(
        58% 0%,
        100% 0%,
        100% 100%,
        55% 100%
    );

    z-index: 5;
}

.body {
    clip-path: polygon(
        34% 0%,
        66% 0%,
        66% 100%,
        34% 100%
    );

    transform-origin: 66% 50%;

    z-index: 4;
}

.tail {
    clip-path: polygon(
        0% 0%,
        42% 0%,
        42% 100%,
        0% 100%
    );

    transform-origin: 42% 50%;

    z-index: 3;
}

.fin-left {
    clip-path: polygon(
        46% 34%,
        65% 24%,
        58% 48%
    );

    transform-origin: 60% 35%;

    z-index: 6;
}

.fin-right {
    clip-path: polygon(
        46% 66%,
        65% 76%,
        58% 52%
    );

    transform-origin: 60% 65%;

    z-index: 6;
}

/* TEXT */

.content {
    position: absolute;

    left: 7%;
    bottom: 10%;

    color: white;

    z-index: 10;
}

.content h1 {
    font-size: clamp(3rem, 8vw, 7rem);

    line-height: 0.9;

    font-weight: 900;

    letter-spacing: -3px;
}

.content p {
    margin-top: 22px;

    max-width: 420px;

    line-height: 1.7;

    color: #ffeaea;
}

button {
    margin-top: 28px;

    padding: 18px 34px;

    border: none;
    border-radius: 40px;

    background: white;
    color: #8b0000;

    font-weight: bold;

    cursor: pointer;
}

/* GLOW */

@keyframes pulse {
    0%,
    100% {
        opacity: 0.55;
    }

    50% {
        opacity: 1;
    }
}
</style>
</head>

<body>

<section class="hero">

    <div class="glow"></div>

    <div class="fish" id="fish">

        <div class="tail"></div>

        <div class="body"></div>

        <div class="head"></div>

        <div class="fin fin-left"></div>

        <div class="fin fin-right"></div>

    </div>

    <div class="content">

        <h1>
            CREATE<br>
            EVERY DAY
        </h1>

        <p>
            Luxury products inspired by timeless Japanese craftsmanship.
        </p>

        <button>
            Shop Now
        </button>

    </div>

</section>

<script>
const fish = document.getElementById("fish");

const tail = document.querySelector(".tail");
const body = document.querySelector(".body");
const head = document.querySelector(".head");
const finLeft = document.querySelector(".fin-left");
const finRight = document.querySelector(".fin-right");

let mouseX = 0;
let mouseY = 0;

let smoothX = 0;
let smoothY = 0;

document.addEventListener("mousemove", (event) => {

    mouseX =
        (event.clientX / window.innerWidth - 0.5) * 20;

    mouseY =
        (event.clientY / window.innerHeight - 0.5) * 12;

});

function animate(time) {

    const t = time * 0.001;

    smoothX += (mouseX - smoothX) * 0.05;
    smoothY += (mouseY - smoothY) * 0.05;

    const swimX = Math.sin(t * 0.42) * 120;
    const swimY = Math.sin(t * 0.84) * 55;

    fish.style.transform = `
        translate(
            calc(-50% + ${swimX + smoothX}px),
            calc(-50% + ${swimY + smoothY}px)
        )
        rotate(
            ${-18 + Math.sin(t * 0.42) * 5}deg
        )
    `;

    tail.style.transform =
        `rotate(${Math.sin(t * 8) * 18}deg)`;

    body.style.transform =
        `rotate(${Math.sin(t * 4) * 3}deg)`;

    head.style.transform =
        `rotate(${Math.sin(t * 4 + 0.8)}deg)`;

    finLeft.style.transform =
        `rotate(${Math.sin(t * 10) * 24}deg)`;

    finRight.style.transform =
        `rotate(${-Math.sin(t * 10) * 24}deg)`;

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>

</body>
</html>
